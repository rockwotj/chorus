[package]
name = "chorus-client"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Quorum write-ahead log for databases over GCS Rapid zonal buckets"
repository = "https://github.com/rockwotj/chorus"
documentation = "https://docs.rs/chorus-client"
readme = "README.md"
keywords = ["gcs", "wal", "write-ahead-log", "quorum", "storage"]
categories = ["database-implementations", "asynchronous"]
exclude = ["src/grpc_internal_tests.rs", "src/grpc_internal_tests/**", "tests/**"]

[features]
default = []
probe-support = []
# Internal capacity introspection and event counters for deterministic simulation.
dst-support = []
# Experimental: pinned to the unreleased pluggable-WAL API. Replace the git
# dependency with a stable release before merging/publishing this integration.
slatedb = ["dep:slatedb"]

[dependencies]
arc-swap.workspace = true
async-stream.workspace = true
async-trait.workspace = true
bytes.workspace = true
crc32c.workspace = true
futures.workspace = true
googleapis-tonic-google-storage-v2.workspace = true
google-cloud-auth.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
sha2.workspace = true
slatedb = { git = "https://github.com/slatedb/slatedb", rev = "31656fe30064ce0d7991a578085341e21438af5e", default-features = false, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
chorus-fake-gcs = { path = "../fake-gcs" }
