[package]
name = "chorus-slatedb-live"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chorus-client = { path = "../../rust/client", features = ["slatedb"] }
futures = "0.3"
google-cloud-auth = { version = "1.12", default-features = false, features = ["default-rustls-provider"] }
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
slatedb = { version = "=0.16.0", default-features = false, features = ["gcp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
